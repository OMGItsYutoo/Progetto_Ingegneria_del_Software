# Caricamento moduli necessari per HTTPS e Reverse Proxy
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so

# CIS 5.8: Disabilitazione del Trace HTTP (XST)
TraceEnable off

# CIS 5.15: Ascolto solo su interfaccia di rete selezionata
Listen 172.20.0.6:8443

# File di runtime in directory dedicata non world-writable 
PidFile /var/run/apache2/httpd.pid
Mutex file:/var/run/apache2 default
SSLSessionCache "shmcb:/var/run/apache2/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# CIS 4.1 & 4.3: Default Deny e blocco .htaccess sulla root OS
<Directory />
    AllowOverride None
    Require all denied
    Options None
</Directory>

# CIS 4.2 & 4.4: Blocco accesso alla DocumentRoot e cgi-bin locali (Reverse Proxy puro)
<Directory "/usr/local/apache2/htdocs">
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory "/usr/local/apache2/cgi-bin">
    Options None
    AllowOverride None
    Require all denied
</Directory>

# CIS 5.10: Blocco accesso a file .ht* (es. .htaccess, .htpasswd)
<FilesMatch "^\.ht"> 
    Require all denied 
</FilesMatch>
<LocationMatch "/\.ht">
    Require all denied
</LocationMatch>

# CIS 5.11: Blocco accesso a file .git (es. .git/config, .gitignore)
<FilesMatch "/\.git">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>
<LocationMatch "/\.git">
    Require all denied
</LocationMatch>

# CIS 5.12: Blocco accesso a file .svn (es. .svn/entries, .svn/format)
<FilesMatch "/\.svn">
    Require all denied
</FilesMatch>
<LocationMatch "/\.svn">
    Require all denied
</LocationMatch>

# CIS 5.13 (Mitigazione compensativa per Reverse Proxy):
# Blocca richieste verso estensioni sensibili/di backup prima che raggiungano Tomcat
# Non è stato possibile utilizzare un approccio whitelist a causa della natura del Reverse Proxy (tutte le richieste vengono inoltrate a Spring Boot/Tomcat che usa URL senza estensione)
<LocationMatch ".(bak|old|orig|sql|swp|env|ini|log|conf)$">
    Require all denied
</LocationMatch>

# Apache Security Tips: Blocco accesso a file nascosti (es. .env, .htaccess, .gitignore)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# CIS 5.9: Blocco richieste HTTP versioni obsolete (1.0)
RewriteEngine On
RewriteCond %{THE_REQUEST} !(HTTP/1\.1|HTTP/2\.0)$
RewriteRule .* - [F]

# CIS 5.14: Blocco richieste IP based
RewriteCond %{HTTP_HOST} !^localhost(:443)?$ [NC] # Da modificare con il nome del dominio pubblico in produzione
RewriteCond %{REQUEST_URI} !^/error [NC]
RewriteRule ^.(.*) - [L,F]

# CIS 6.1: Log level configuration
LogLevel notice core:info

# CIS 6.6: ModSecurity enabled (mod_security)
<IfModule security2_module>
    Include /usr/local/apache2/conf/extra/modsecurity.conf
    Include /usr/local/apache2/conf/extra/modsecurity-crs/crs-setup.conf
    Include /usr/local/apache2/conf/extra/modsecurity-crs/rules/*.conf
</IfModule>

# CIS 7.4: Disabilitazione protocolli SSL/TLS obsoleti (SSLv2, SSLv3, TLSv1, TLSv1.1) 
SSLProtocol -all +TLSv1.2 +TLSv1.3

# CIS 7.5-7.8-7.12: Disabilitazione suite di cifratura deboli e non sicure (RC4, 3DES, IDEA, SHA1), forzando l'ordine di preferenza delle suite di cifratura per evitare attacchi di downgrade (BEAST, POODLE, DROWN, SWEET32)
SSLHonorCipherOrder On
SSLCipherSuite ECDHE:DHE:!NULL:!SSLv2:!RC4:!aNULL:!3DES:!IDEA:!SHA1

# CIS 7.6: Disabilitazione renegotiation SSL/TLS insicura
SSLInsecureRenegotiation off

# CIS 7.7: Disabilitazione compressione SSL/TLS insicura (CRIME)
SSLCompression off

# CIS 8.1: Disabilitazione banner di versione Apache (ServerTokens Prod) 
ServerTokens Prod

# CIS 8.2: Disabilitazione informazioni sensibili nel footer (ServerSignature Off)
ServerSignature Off

# CIS 9.1: Impostazione timeout per mitigazione attacchi DoS (Slowloris)
Timeout 10

# CIS 9.2: Impostazione KeepAlive per ridurre overhead di connessione 
KeepAlive On

# CIS 9.3: Impostazione numero massimo di richieste per connessione KeepAlive
MaxKeepAliveRequests 100

# CIS 9.4: Impostazione timeout per connessioni KeepAlive
KeepAliveTimeout 5

# CIS 9.5: Impostazione RequestReadTimeout per mitigazione attacchi DoS 
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

# CIS 10.1: Impostazione limite massimo per la lunghezza della Request Line 
LimitRequestLine 8190

# CIS 10.2: Impostazione limite massimo per il numero di campi della Request Header
LimitRequestFields 100

# CIS 10.3: Impostazione limite massimo per la lunghezza dei campi della Request Header
LimitRequestFieldSize 8190

# CIS 10.4: Impostazione limite massimo per la lunghezza della Request Body
LimitRequestBody 102400

# OWASP HTTP Smuggling: Impostazione Strict HttpProtocolOptions per mitigare attacchi di HTTP Smuggling 
HttpProtocolOptions Strict

# Redirect automatico da HTTP (8080) a HTTPS (8443)
<VirtualHost *:8080>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

    # CIS 5.9: Ereditamento regole per blocco richieste HTTP versioni obsolete (1.0)
    RewriteOptions Inherit
</VirtualHost>

# VirtualHost HTTPS Reverse Proxy verso Spring Boot (Tomcat embedded)
<VirtualHost *:8443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile "/etc/ssl/apache/fullchain.crt"
    SSLCertificateKeyFile "/etc/ssl/apache/server.key"

    # CIS 5.7: Blocco metodi HTTP non sicuri (GET, HEAD, POST, OPTIONS consentiti)
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD|POST|OPTIONS)$ [NC]
    RewriteRule .* - [F]

    # CIS 5.9: Ereditamento regole per blocco richieste HTTP versioni obsolete (1.0)
    RewriteOptions Inherit

    # Inoltro contesto HTTPS al backend Spring Boot
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # CIS 4.2: Autorizza esplicitamente solo il traffico verso il Reverse Proxy
    <Proxy "http://app:8080/*">
        Require all granted
    </Proxy>

    ProxyPass / http://app:8080/
    ProxyPassReverse / http://app:8080/

    # CIS 5.16/18: Header di sicurezza aggiuntivi
    Header always set Content-Security-Policy "upgrade-insecure-requests; frame-ancestors 'self';"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

    # CIS 7.11: HTTPS Strict Transport Security (HSTS) per forzare l'uso di HTTPS e prevenire attacchi di downgrade
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # OWASP: Secure Headers, Cookie e Anti-Spoofing Proxy
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"

    Header always unset X-Powered-By
    Header always unset Server

    Header always edit Set-Cookie "(?i)^((?:(?!;\s*Secure).)+)$" "$1; Secure"
    Header always edit Set-Cookie "(?i)^((?:(?!;\s*HttpOnly).)+)$" "$1; HttpOnly"
    Header always edit Set-Cookie "(?i)^((?:(?!;\s*SameSite).)+)$" "$1; SameSite=Lax"

    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
