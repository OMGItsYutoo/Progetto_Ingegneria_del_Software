spring.application.name=ciuIsMeglCheUan
logging.level.database.ScooterDAO=DEBUG
spring.config.import=optional:configtree:/run/secrets/
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

# CIS Tomcat 2.5: Impedisce l'invio di stack trace o messaggi d'errore interni ai client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# CIS Tomcat 2.4 / 2.7: Nessun header Server rivelatore
server.server-header=

# CIS Tomcat 6.3 / 6.4: Riconosce HTTPS terminato dal Reverse Proxy Apache
server.forward-headers-strategy=native

# Protezione cookie di sessione (JSESSIONID)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# CIS Tomcat 10.9 & 10.10: Limiti timeout e dimensione header HTTP (DoS)
server.tomcat.connection-timeout=20000
server.max-http-header-size=8KB