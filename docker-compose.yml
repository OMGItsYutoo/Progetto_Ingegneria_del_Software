services:
  vault:
    image: hashicorp/vault
    container_name: ciuismeglchuan-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/ceremony.sh:/ceremony.sh:ro
    command: server 
    networks:
      ciuismeglchuan_net:
        ipv4_address: 172.20.0.2

  vault-init:
    image: hashicorp/vault
    container_name: ciuismeglchuan-vault-init
    user: "0:0"
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    depends_on:
      - vault
    networks:
      ciuismeglchuan_net:
        ipv4_address: 172.20.0.3
    volumes:
      - vault_data:/vault/file
      - ./vault/unseal-and-provision.sh:/unseal-and-provision.sh:ro
      - runtime_secrets:/run/secrets
      - apache_certs:/certs
    entrypoint: ["/bin/sh", "/unseal-and-provision.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/secrets/db_password && test -f /certs/server.key"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql-db:
    image: mysql:8.0
    container_name: ciuismeglchuan-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    depends_on:
      vault-init:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
      - runtime_secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$(cat /run/secrets/db_password)"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      ciuismeglchuan_net:
        ipv4_address: 172.20.0.4

  app:
    build: ./ciuIsMeglCheUan
    container_name: ciuismeglchuan
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - runtime_secrets:/run/secrets:ro
    networks:
      ciuismeglchuan_net:
        ipv4_address: 172.20.0.5

  apache:
    build: ./apache
    container_name: ciuismeglchuan-apache
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      vault-init:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    tmpfs:
      - /var/run/apache2:uid=33,gid=33,mode=0750
      - /var/run/apache2/logs:uid=33,gid=33,mode=0750
      - /var/run/apache2/modsec:uid=33,gid=33,mode=0750
      - /var/log/apache2:uid=33,gid=33,mode=0750
      - /tmp:uid=33,gid=33,mode=1777
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:80:8080"
      - "${HOST_BIND_IP:-127.0.0.1}:443:8443"
    volumes:
      - apache_certs:/etc/ssl/apache:ro
    networks:
      ciuismeglchuan_net:
        ipv4_address: 172.20.0.6

volumes:
  vault_data:
  mysql_data:
  apache_certs:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0750,uid=0,gid=33"
  runtime_secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=0755"

networks:
  ciuismeglchuan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24