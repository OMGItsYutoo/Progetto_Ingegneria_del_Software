services:
  vault:
    image: hashicorp/vault
    container_name: ciuismeglchuan-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/ceremony.sh:/ceremony.sh:ro
    command: server 

  vault-init:
    image: hashicorp/vault
    container_name: ciuismeglchuan-vault-init
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - vault
    volumes:
      - vault_data:/vault/file
      - ./vault/unseal-and-provision.sh:/unseal-and-provision.sh:ro
      - runtime_secrets:/run/secrets
      - apache_certs:/certs
    entrypoint: ["/bin/sh", "/unseal-and-provision.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/secrets/db_password && test -f /certs/server.key"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql-db:
    image: mysql:8.0
    container_name: ciuismeglchuan-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    depends_on:
      vault-init:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
      - runtime_secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$(cat /run/secrets/db_password)"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./ciuIsMeglCheUan
    container_name: ciuismeglchuan
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - runtime_secrets:/run/secrets:ro

  apache:
    build: ./apache
    container_name: ciuismeglchuan-apache
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - apache_certs:/usr/local/apache2/certs:ro

volumes:
  vault_data:
  mysql_data:
  apache_certs:
  runtime_secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=0755"